limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
server {
    listen 80;
    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = /login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }
    location ~ ^/(?:$|static/|login$|logout$|health$|produtos/|posicoes(?:/|$)|vinculos$|movimentar$|baixa-rapida$|estorno$|historico(?:/|$)|mapa$|ocupacao$|usuarios(?:/|$)|permissoes$|busca-assistida$|iot/|alexa/) {
        limit_except GET POST { deny all; }
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
