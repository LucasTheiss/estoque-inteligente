limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
server {
    listen 80;
    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location = /login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/(?:$|assets/|login$|logout$|health$|fornecedores$|ofertas$|comparacao-precos$|relatorios$|modelos(?:/|$)|produtos(?:/|$)|posicoes(?:/|$)|vinculos$|movimentar$|baixa-rapida$|estorno$|historico(?:/|$)|mapa$|ocupacao$|usuarios(?:/|$)|permissoes$|busca-assistida$|global(?:/|$)|excluir/|iot/|api/iot/|alexa/) {
        limit_except GET POST { deny all; }
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
