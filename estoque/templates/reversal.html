{% extends 'base.html' %}{% from 'macros.html' import csrf %}
{% block content %}<section class="narrow"><h1>Estorno de movimentações</h1><p>Reverta entradas ou saídas com justificativa e rastreabilidade.</p><form method="post" class="panel" data-confirm="Confirmar estorno? Será criado um novo registro de auditoria.">{{ csrf() }}<input type="hidden" name="request_key" value="{{ request_key }}"><label>Movimentação original<select name="movement_id" required>{% for r in rows if r.kind in ['entrada','saida'] %}<option value="{{ r.id }}">#{{ r.id }} · {{ r.kind }} · {{ r.sku }} · {{ r.code }} · {{ '%g'|format(r.delta) }}</option>{% endfor %}</select></label><label>Justificativa detalhada<textarea name="reason" required maxlength="1000" placeholder="Descreva o motivo do estorno"></textarea></label><label class="check"><input type="checkbox" name="notify" value="1">Registrar alerta para a gerência no histórico</label><button class="danger">Confirmar estorno</button></form></section>{% endblock %}
