{% macro csrf() %}<input type="hidden" name="csrf" value="{{ csrf_token() }}">{% endmacro %}
{% macro input(name,label,value='',type='text',required=false,step='',min='',max='') %}
<label>{{ label }}<input name="{{ name }}" type="{{ type }}" value="{{ value if value is not none else '' }}" {% if required %}required{% endif %} {% if step %}step="{{ step }}"{% endif %} {% if min != '' %}min="{{ min }}"{% endif %} {% if max != '' %}max="{{ max }}"{% endif %} {% if type=='text' %}maxlength="120"{% endif %}></label>
{% endmacro %}
{% macro signal(id) %}<button type="button" class="outline" data-signal="{{ id }}">Acionar LED</button>{% endmacro %}
{% macro stock_form(row,key,kind='saida',quantity='1',label='−1 unidade') %}
<form method="post" action="{{ url_for('web.movement') }}" class="inline">{{ csrf() }}
<input type="hidden" name="request_key" value="{{ key }}"><input type="hidden" name="kind" value="{{ kind }}">
<input type="hidden" name="product_id" value="{{ row.product_id }}"><input type="hidden" name="position_id" value="{{ row.position_id }}">
<input type="hidden" name="quantity" value="{{ quantity }}"><input type="hidden" name="reason" value="Baixa rápida pela interface">
<button class="danger" {% if row.quantity|float < quantity|float %}disabled{% endif %}>{{ label }}</button></form>
{% endmacro %}
