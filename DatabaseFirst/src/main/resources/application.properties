spring.application.name=Database First
spring.datasource.url=${DF_DB_URL}
spring.datasource.username=${DF_DB_USER}
spring.datasource.password=${DF_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.jooq.sql-dialect=POSTGRES
# As migrations sao aplicadas apenas pelo comando prepare, no container exclusivo.
# Assim a verificacao do banco no startup ocorre antes de qualquer escrita.
spring.flyway.enabled=false
server.port=8082
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
spring.thymeleaf.cache=false
