name: estoque-databasefirst
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estoque_databasefirst
      POSTGRES_USER: ${DF_DB_USER:?execute demo.ps1 prepare}
      POSTGRES_PASSWORD: ${DF_DB_PASSWORD:?execute demo.ps1 prepare}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - databasefirst-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d estoque_databasefirst']
      interval: 2s
      timeout: 3s
      retries: 30
  maven:
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace/DatabaseFirst
    volumes:
      - ../:/workspace
      - databasefirst-maven:/root/.m2
    environment:
      DF_DB_URL: jdbc:postgresql://db:5432/estoque_databasefirst
      DF_DB_USER: ${DF_DB_USER}
      DF_DB_PASSWORD: ${DF_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
volumes:
  databasefirst-data:
  databasefirst-maven:
