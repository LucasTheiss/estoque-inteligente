
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure .env ou use .env.demo}
    command: [postgres, -c, shared_buffers=16MB, -c, max_connections=20, -c, work_mem=1MB]
    volumes:
      - java-database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    mem_limit: 80m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U estoque]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/estoque
      DATABASE_USER: estoque
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?configure a senha global}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_IOT_ENABLED: ${DEMO_IOT_ENABLED:-false}
      MQTT_USER: ${MQTT_USER:?configure .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?configure .env}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    mem_limit: 172m
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      start_period: 60s
      interval: 15s
      timeout: 3s
      retries: 5

  mqtt-init:
    image: eclipse-mosquitto:2
    user: root
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    entrypoint: [/bin/sh, -ec]
    command:
      - 'if [ -f /auth/passwords ]; then mosquitto_passwd -b /auth/passwords "$$MQTT_USER" "$$MQTT_PASSWORD"; else mosquitto_passwd -b -c /auth/passwords "$$MQTT_USER" "$$MQTT_PASSWORD"; fi; chown 1883:1883 /auth/passwords; chmod 600 /auth/passwords'
    volumes:
      - mqtt-auth:/auth

  mqtt:
    image: eclipse-mosquitto:2
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-auth:/auth:ro
    ports:
      - "${MQTT_BIND:-127.0.0.1}:1883:1883"
    mem_limit: 16m
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 16m
    restart: unless-stopped

  verify:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: [check]
    working_dir: /work
    volumes:
      - ./:/source:ro
      - maven-cache:/root/.m2
    environment:
      TEST_DATABASE_URL: jdbc:postgresql://db:5432/estoque
      TEST_MQTT_URI: tcp://mqtt:1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      DATABASE_USER: estoque
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    entrypoint: [/bin/sh, -ec]
    command:
      - 'cp /source/pom.xml . && cp -R /source/src . && mvn -B test'

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  java-database:
  mqtt-auth:
  maven-cache:
