services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure .env}
    command: [postgres, -c, shared_buffers=16MB, -c, max_connections=20, -c, work_mem=1MB]
    volumes: [database:/var/lib/postgresql/data]
    mem_limit: 112m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U estoque]
      interval: 10s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?configure .env}
      DATABASE_URL: postgresql://estoque:${POSTGRES_PASSWORD}@db:5432/estoque
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MQTT_USER: ${MQTT_USER:?configure .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?configure .env}
    depends_on:
      db: {condition: service_healthy}
      mqtt: {condition: service_started}
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
  mqtt-init:
    image: eclipse-mosquitto:2
    user: root
    environment:
      MQTT_USER: ${MQTT_USER:?configure .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?configure .env}
    entrypoint: [/bin/sh, -ec]
    command: ['mosquitto_passwd -b -c /auth/passwords "$$MQTT_USER" "$$MQTT_PASSWORD"; chown 1883:1883 /auth/passwords; chmod 600 /auth/passwords']
    volumes: [mqtt-auth:/auth]
  mqtt:
    image: eclipse-mosquitto:2
    depends_on:
      mqtt-init: {condition: service_completed_successfully}
    volumes: [./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro, mqtt-auth:/auth:ro]
    ports: ['${MQTT_BIND:-127.0.0.1}:1883:1883']
    mem_limit: 16m
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:80']
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [app]
    mem_limit: 16m
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [nginx]
    restart: unless-stopped
volumes:
  database:
  mqtt-auth:
