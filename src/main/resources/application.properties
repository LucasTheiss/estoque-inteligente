spring.application.name=Estoque Inteligente
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/estoque}
spring.datasource.username=${DATABASE_USER:estoque}
spring.datasource.password=${DATABASE_PASSWORD:${POSTGRES_PASSWORD:Banco-demo-local-2026!}}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
server.port=${PORT:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
spring.servlet.multipart.max-file-size=128KB
spring.servlet.multipart.max-request-size=128KB
server.tomcat.max-http-form-post-size=128KB
server.tomcat.threads.max=12
server.tomcat.threads.min-spare=2
spring.thymeleaf.cache=true
app.demo=${DEMO_ENABLED:false}
app.demo-iot=${DEMO_IOT_ENABLED:false}
app.demo-password=${DEMO_PASSWORD:}
app.superadmin-password=${SUPERADMIN_PASSWORD:}
app.mqtt-user=${MQTT_USER:}
app.mqtt-password=${MQTT_PASSWORD:}
