<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::section})}">
    <section>
        <nav th:replace="~{layout :: cadastros}">
        </nav>
        <p class="lead">
            Associe cada produto à posição em que ele será armazenado.
        </p>
        <form method="get" th:action="@{/vinculos}" class="search-bar">
            <input th:if="${item != null}" type="hidden" name="productId" th:value="${item.productId}">
            <input th:if="${item != null}" type="hidden" name="positionId" th:value="${item.positionId}">
            <label class="sr-only" for="q">
                Localizar produto para vincular
            </label>
            <input id="q" name="q" type="search" th:value="${q}" placeholder="Pesquise o produto por nome ou SKU" maxlength="200">
            <button>
                Buscar produto
            </button>
        </form>
        <h2 th:text="${item == null ? 'Novo vínculo' : 'Editar vínculo'}">
        </h2>
        <p class="hint" th:if="${item != null}">
            A edição exige saldo zero. O histórico das movimentações anteriores é preservado.
        </p>
        <form method="post" th:action="@{/vinculos}" class="inline-form">
            <input type="hidden" name="action" th:value="${item == null ? 'create' : 'update'}">
            <input th:if="${item != null}" type="hidden" name="originalProductId" th:value="${item.productId}">
            <input th:if="${item != null}" type="hidden" name="originalPositionId" th:value="${item.positionId}">
            <label>
                Produto
                <select name="productId" required>
                    <option value="">
                        Selecione
                    </option>
                    <option th:each="p : ${produtos}" th:value="${p.produto.id}" th:selected="${item != null and item.productId == p.produto.id}" th:text="|${p.produto.sku} · ${p.modelo.name} · ${p.produto.unit}|">
                    </option>
                </select>
            </label>
            <label>
                Posição
                <select name="positionId" required>
                    <option value="">
                        Selecione
                    </option>
                    <option th:each="p : ${positions}" th:value="${p.posicao.id}" th:selected="${item != null and item.positionId == p.posicao.id}" th:text="|${p.posicao.code} · ${p.posicao.sector} · ${p.posicao.unit}|">
                    </option>
                </select>
            </label>
            <button th:text="${item == null ? 'Vincular produto' : 'Salvar vínculo'}">
            </button>
            <a th:if="${item != null}" th:href="@{/vinculos}">
                Cancelar edição
            </a>
        </form>
        <div class="table-wrap" tabindex="0" role="region" aria-label="Produtos por posição">
            <table>
                <caption class="sr-only">
                    Produtos vinculados às posições
                </caption>
                <thead>
                    <tr>
                        <th>
                            Produto
                        </th>
                        <th>
                            SKU
                        </th>
                        <th>
                            Posição
                        </th>
                        <th>
                            Saldo
                        </th>
                        <th>
                            Ação
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${vinculos}">
                        <td th:text="${v.name}">
                        </td>
                        <td th:text="${v.sku}">
                        </td>
                        <td th:text="|${v.code} · ${v.sector}|">
                        </td>
                        <td class="number" th:text="|${v.ocupacao.quantity.stripTrailingZeros().toPlainString()} ${v.unit}|">
                        </td>
                        <td>
                            <div class="actions" th:if="${v.ocupacao.quantity.signum() == 0}">
                                <a th:href="@{/vinculos(productId=${v.ocupacao.productId},positionId=${v.ocupacao.positionId})}" th:attr="aria-label=|Editar vínculo ${v.sku} em ${v.code}|">
                                    Editar
                                </a>
                                <form th:action="@{/vinculos}" method="post" data-confirm="Remover este vínculo vazio?">
                                    <input type="hidden" name="productId" th:value="${v.ocupacao.productId}">
                                    <input type="hidden" name="positionId" th:value="${v.ocupacao.positionId}">
                                    <input type="hidden" name="action" value="delete">
                                    <button class="quiet">
                                        Remover vínculo
                                    </button>
                                </form>
                            </div>
                            <span th:unless="${v.ocupacao.quantity.signum() == 0}" class="muted">
                                Zere o saldo para editar ou remover.
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${vinculos.isEmpty()}">
                        <td colspan="5" class="empty">
                            Nenhum vínculo cadastrado.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</html>
