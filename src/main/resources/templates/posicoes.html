<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::section})}"><section>
<nav th:replace="~{layout :: cadastros}"></nav><div class="editor-layout"><div class="table-wrap" tabindex="0" role="region" th:attr="aria-label=${title}"><table><caption class="sr-only">Posições cadastradas</caption><thead><tr><th>Posição</th><th>Setor</th><th>Linha / coluna</th><th>Ocupação / capacidade</th><th>Ação</th></tr></thead><tbody>
<tr th:each="p : ${positions}"><td th:text="${p.posicao.code}"></td><td th:text="${p.posicao.sector}"></td><td th:text="|${p.posicao.rowNo} / ${p.posicao.colNo}|"></td><td class="number" th:text="|${p.quantidade.stripTrailingZeros().toPlainString()} / ${p.posicao.capacity.stripTrailingZeros().toPlainString()} ${p.posicao.unit}|"></td><td><a th:href="@{/posicoes(id=${p.posicao.id})}">Editar</a></td></tr><tr th:if="${positions.isEmpty()}"><td colspan="5" class="empty">Cadastre as posições físicas da loja para começar.</td></tr></tbody></table></div>
<aside class="editor"><h2 th:text="${item == null ? 'Nova posição' : 'Editar posição'}"></h2><form method="post" th:action="@{/posicoes}" class="form-stack">
<input type="hidden" name="id" th:value="${item?.id}">
<div class="form-row"><label>Código<input name="code" required maxlength="200" placeholder="A1" th:value="${item?.code}"></label><label>Setor<input name="sector" required maxlength="200" th:value="${item?.sector}"></label></div>
<div class="form-row"><label>Linha<input name="rowNo" type="number" min="0" max="10000" required th:value="${item?.rowNo ?: 0}"></label><label>Coluna<input name="colNo" type="number" min="0" max="10000" required th:value="${item?.colNo ?: 0}"></label></div>
<div class="form-row"><label>Capacidade<input name="capacity" type="number" min="0.001" step="0.001" required th:value="${item?.capacity ?: 30}"></label><label>Unidade<select name="unit"><option value="un">Unidade</option><option th:if="${tenant.fractional}" value="kg" th:selected="${item != null and item.unit == 'kg'}">Quilograma</option></select></label></div>
<fieldset th:if="${tenant.iot}"><legend>Sinalização da posição</legend><label>Dispositivo<input name="device" maxlength="200" pattern="[a-zA-Z0-9_-]*" th:value="${item?.device}" placeholder="esp32-demo"></label><label>Pino do LED<input name="pin" type="number" min="0" max="39" th:value="${item?.pin}"></label></fieldset>
<div class="actions"><button>Salvar posição</button><a th:if="${item != null}" th:href="@{/posicoes}">Nova posição</a></div></form>
<form th:if="${item != null}" th:action="@{/excluir/posicao/{id}(id=${item.id})}" method="post" data-confirm="Excluir esta posição? O histórico será preservado."><button class="danger">Excluir posição</button></form></aside></div>
</section></html>
