<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: documentHead}">
    </head>
    <body class="error-page">
        <main class="error-panel">
            <p class="status-code" th:text="${status}">
            </p>
            <h1>
                Esta página não está disponível
            </h1>
            <p>
                Confira o endereço ou volte para o estoque. Se a sessão terminou, entre novamente.
            </p>
            <div class="actions">
                <a class="button" th:href="@{/}">
                    Ir para o estoque
                </a>
                <a th:href="@{/login}">
                    Entrar novamente
                </a>
            </div>
        </main>
    </body>
</html>
